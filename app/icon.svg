<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="45%" stop-color="#0D1D38" />
      <stop offset="100%" stop-color="#142B4E" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#4A7FC9" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E4B8F" stop-opacity="0.15" />
    </linearGradient>

    <!-- R/M Primary Gradient (White to Platinum) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Electric Accent Gradient (Istmo Blue to Cyan) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Signal Dot Gradient -->
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#centerGlow)" />

  <!-- Monogram R -->
  <!-- R Stem & Top Bowl -->
  <path
    d="M 96 136
       L 192 136
       C 228 136 252 158 252 192
       C 252 226 228 248 192 248
       L 142 248
       L 142 376
       L 96 376
       Z
       M 142 178
       L 142 206
       L 188 206
       C 202 206 210 200 210 192
       C 210 184 202 178 188 178
       Z"
    fill="url(#primaryGrad)"
  />

  <!-- R Dynamic Diagonal Leg (Electric Accent) -->
  <path
    d="M 172 236
       L 218 236
       L 266 376
       L 216 376
       L 182 278
       L 158 278
       Z"
    fill="url(#accentGrad)"
  />

  <!-- Monogram M -->
  <path
    d="M 270 376
       L 270 136
       L 316 136
       L 360 262
       L 404 136
       L 450 136
       L 450 376
       L 406 376
       L 406 208
       L 371 312
       L 349 312
       L 314 208
       L 314 376
       Z"
    fill="url(#primaryGrad)"
  />

  <!-- Active Telemetry Dot (Automation & Analytics Signal) -->
  <circle cx="432" cy="94" r="22" fill="url(#signalGrad)" />
  <circle cx="432" cy="94" r="9" fill="#FFFFFF" opacity="0.9" />
</svg>
